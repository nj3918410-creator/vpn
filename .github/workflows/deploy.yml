name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: [ main ] # আপনার প্রধান ব্রাঞ্চের নাম main বা master হতে পারে

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # আপনার প্রজেক্টের রিকোয়ারমেন্ট অনুযায়ী ভার্সন দিতে পারেন
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Vite-এর বিল্ড ফোল্ডার সাধারণত dist হয়
