<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flagBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing shield -->
  <path d="M 256 64 L 400 120 C 400 270 330 380 256 432 C 182 380 112 270 112 120 Z" 
        fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="12" stroke-linejoin="round"/>

  <!-- French Flag stripes inside shield -->
  <!-- Blue band -->
  <path d="M 170 144 C 170 230 196 310 230 370 L 195 388 C 145 320 132 230 132 140 L 170 144 Z" fill="url(#flagBlue)" opacity="0.9"/>
  <!-- Red band -->
  <path d="M 342 144 C 342 230 316 310 282 370 L 317 388 C 367 320 380 230 380 140 L 342 144 Z" fill="url(#flagRed)" opacity="0.9"/>

  <!-- Central Lock / Cyber VPN Emblem -->
  <!-- Lock body -->
  <rect x="206" y="232" width="100" height="84" rx="18" fill="#3b82f6" stroke="#93c5fd" stroke-width="4"/>
  <!-- Lock shackle -->
  <path d="M 226 232 V 196 C 226 179 239 166 256 166 C 273 166 286 179 286 196 V 232" 
        fill="none" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="256" cy="268" r="8" fill="#ffffff"/>
  <path d="M 253 268 L 251 292 H 261 L 259 268 Z" fill="#ffffff"/>

  <!-- Signal / Wi-Fi arches -->
  <path d="M 216 130 C 238 116 274 116 296 130" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <path d="M 194 104 C 230 84 282 84 318 104" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Speed lightning / 2s badge -->
  <g transform="translate(230, 340)">
    <rect x="-24" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="26" y="22" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle">2s IP</text>
  </g>
</svg>
